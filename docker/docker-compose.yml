version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: satquery-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - USE_MOCK_MODELS=true
      - MODEL_DEVICE=cpu
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - ../uploads:/app/uploads
      - ../evidence_outputs:/app/evidence_outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
